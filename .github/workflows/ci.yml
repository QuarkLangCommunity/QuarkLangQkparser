name: ci
on: [push, pull_request]

# Least privilege: CI only reads the repository (every job here just checks out, builds, tests and
# checks formatting).
permissions:
  contents: read

# A new push on the same ref cancels older runs (saves runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform gate: the same syntax-layer tests run on Linux / macOS / Windows.
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Build & test
        run: |
          go build ./...
          go test ./... -count=1
      # shell: bash is required, not cosmetic. Only Windows has a different default shell (pwsh), and the
      # step below is sh syntax: `unformatted=$(...)` and `[ -n "$unformatted" ]` are a PowerShell parse
      # error, so without this line the Windows leg died in the step runner before gofmt ever ran, while
      # ubuntu and macos passed. bash is present on all three runners, so pinning the shell keeps the
      # check identical — and equally strict — everywhere instead of silently skipping the platform.
      #
      # The second half of the same platform problem is .gitattributes: fixing the shell is what let this
      # step run on Windows for the first time, and it immediately reported every file, because a Windows
      # checkout is CRLF (a .go checkout with core.autocrlf=true) and gofmt calls a CRLF file unformatted.
      # The `*.go text eol=lf` rule keeps the working tree LF there, so this gate now measures formatting
      # on all three platforms rather than line endings on one of them.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
